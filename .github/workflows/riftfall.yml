name: Verify RIFTFALL
on:
  push:
    paths: ['riftfall/**', '.github/workflows/riftfall.yml']
  pull_request:
    paths: ['riftfall/**', '.github/workflows/riftfall.yml']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: riftfall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run test:contracts
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: El build de producción no expone ganchos de test
        run: "! grep -qE '__RIFTFALL__|__CARGO__' dist/assets/*.js"
      - name: El Lanzador no se publica junto al juego
        run: test ! -e dist/lanzar.html
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:chain
      - name: Capturas y diagnóstico de fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RIFTFALL-SCREENSHOTS
          path: riftfall/test-results/
          retention-days: 7
          if-no-files-found: ignore
